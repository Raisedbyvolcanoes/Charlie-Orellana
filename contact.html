<main>
  <section class="section contact contact-page reveal">
    <div class="contact-image">
      <img src="tousecontact.jpg" alt="Charlie Orellana, filmmaker and photographer" width="1280" height="1600" />
    </div>
    <div class="contact-form-wrap">
      <h1>Contact</h1>
      <p class="contact-intro">
        Open to a limited number of commissions each year, as well as
        brand partnerships.<br />
        Tell me about your project and I&rsquo;ll reply personally.
      </p>
      <form class="contact-form" name="contact-page" method="POST">
        <input type="hidden" name="access_key" value="cbae8a51-a42c-4585-a53d-71b33facf0b2" />
        <input type="hidden" name="subject" value="New inquiry from Raised by Volcanoes (Contact page)" />
        <input type="checkbox" name="botcheck" class="botcheck" style="display: none" tabindex="-1" autocomplete="off" />
        <div class="form-row">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required />
        </div>
        <div class="form-row">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required />
        </div>
        <div class="form-row">
          <label for="project-type">Project type</label>
          <select id="project-type" name="project-type" required>
            <option value="" disabled selected>Select one</option>
            <option value="music-video">Music video</option>
            <option value="documentary">Documentary</option>
            <option value="festival">Festival / live event</option>
            <option value="brand">Brand / commercial campaign</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="form-row">
          <label for="description">Project description</label>
          <textarea id="description" name="description" rows="3" required></textarea>
        </div>
        <button type="submit" class="contact-submit">Send Inquiry</button>
        <p class="form-status" role="status" aria-live="polite"></p>
      </form>
    </div>
  </section>
</main>
